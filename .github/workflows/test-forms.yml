name: Test site forms

# Guard: every form on the site (subscribe, waitlist, contact, speaking) must
# actually submit somewhere. Runs the Playwright suite in tests/ against the
# committed dist/app.js on every push to dev or main, and daily — so a silent
# regression (or a Web3Forms config change) shows up as a failed-run email.
on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "17 14 * * *"   # daily, 7:17am PT
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-forms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build + test every form
        run: npm test
        env:
          CI: "1"
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
