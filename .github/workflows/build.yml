name: Build site bundle

# Safety net: if src/*.jsx changes and dist/app.js wasn't rebuilt alongside it,
# rebuild and commit so the published site never runs a stale bundle.
on:
  push:
    branches: [dev, main]
    paths:
      - "src/**"
      - "scripts/build.mjs"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit dist if it changed
        run: |
          if [[ -z "$(git status --porcelain dist/)" ]]; then
            echo "dist/app.js already up to date."
            exit 0
          fi
          git config user.name  "collinwallace-bot"
          git config user.email "noreply@collinwallace.com"
          git add dist/
          git commit -m "Rebuild dist/app.js (auto)"
          git push
